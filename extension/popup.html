<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anti-WebP Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="#818CF8" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="brand-title">Anti-WebP</h1>
      </div>
      <span class="status-badge">Set & Forget</span>
    </header>

    <!-- Main Settings Panel -->
    <main class="settings-panel">
      <!-- Format Selector (Pill Segmented Control) -->
      <div class="field-group">
        <label class="field-label">Default Format</label>
        <div class="segmented-control" role="radiogroup" aria-label="Default Format">
          <button type="button" class="segment-btn active" data-format="png" id="btn-png" role="radio" aria-checked="true">
            <span class="btn-text">PNG</span>
            <span class="sub-label">Lossless</span>
          </button>
          <button type="button" class="segment-btn" data-format="jpg" id="btn-jpg" role="radio" aria-checked="false">
            <span class="btn-text">JPG</span>
            <span class="sub-label">Compact</span>
          </button>
        </div>
      </div>

      <!-- JPG Quality Slider (Only visible if JPG is selected) -->
      <div class="field-group quality-group" id="quality-wrapper" style="display: none;">
        <div class="slider-header">
          <label for="quality-slider" class="field-label">JPG Quality</label>
          <span class="quality-value" id="quality-val">92%</span>
        </div>
        <input 
          type="range" 
          id="quality-slider" 
          min="40" 
          max="100" 
          value="92" 
          step="1"
          class="quality-range"
        >
      </div>

      <!-- User Note -->
      <p class="usage-note">
        Right-click any image and select <strong>'Anti-WebP: Save Image'</strong> to use these settings.
      </p>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
